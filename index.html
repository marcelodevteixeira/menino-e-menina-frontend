<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menino E Menina - Gestão de Produtos</title>
    <meta name="description" content="Sistema de gestão e controle de produtos e estoque da loja Menino E Menina." />
    <meta property="og:title" content="Menino E Menina - Gestão de Produtos" />
    <meta property="og:description" content="Sistema de gestão e controle de produtos e estoque da loja Menino E Menina." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Cold Start Loading Screen -->
    <div id="cold-start-overlay">
      <div class="spinner"></div>
      <div class="cold-start-brand">Menino E Menina</div>
      <div class="cold-start-message">Conectando ao servidor. Isso pode levar até um minuto...</div>
      <div class="cold-start-subtext">
        <span>Servidor em inicialização (Render)</span>
        <span class="cold-start-timer" id="cold-start-elapsed">0s</span>
      </div>
    </div>

    <!-- Mobile Header -->
    <header class="mobile-header">
      <button class="menu-toggle-btn" id="mobile-menu-btn" aria-label="Abrir menu de categorias">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="brand-title" style="font-size: 19px;">
        Menino E Menina
      </div>
      <button class="btn-primary" id="mobile-new-product-btn" style="padding: 7px 12px; font-size: 13px;">
        + Novo
      </button>
    </header>

    <div class="app-container">
      <!-- Left Sidebar (Categorias) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-title">
            <span>Menino E Menina</span>
          </div>
          <div style="margin-top: 6px;">
            <span class="brand-badge">Módulo de Produtos</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section-title">Categorias</div>
          <ul class="category-list" id="categories-container">
            <!-- Populated dynamically via JS -->
            <li>
              <button class="category-item active" data-category-id="">
                <span>Todas as Categorias</span>
                <span class="category-count" id="total-count-badge">0</span>
              </button>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>API Conectada</span>
          </div>
          <span style="color: var(--text-muted); font-size: 11px;">v1.0</span>
        </div>
      </aside>

      <!-- Main Area (Produtos) -->
      <main class="main-content">
        <!-- Action Bar -->
        <div class="action-bar">
          <div class="action-bar-left">
            <h1 id="current-category-title">Todos os Produtos</h1>
            <p id="products-count-label">Carregando catálogo...</p>
          </div>

          <div class="action-bar-right">
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="search-input" class="search-input" placeholder="Buscar por nome..." />
            </div>

            <button class="btn-primary" id="open-modal-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Cadastrar Novo Produto</span>
            </button>
          </div>
        </div>

        <!-- Products Grid Container -->
        <div class="products-grid" id="products-grid">
          <!-- Rendered dynamically via JS -->
        </div>
      </main>
    </div>

    <!-- Modal de Cadastro de Produto -->
    <div class="modal-backdrop" id="product-modal">
      <div class="modal-card">
        <div class="modal-header">
          <h2 class="modal-title">Cadastrar Novo Produto</h2>
          <button class="modal-close-btn" id="close-modal-btn" aria-label="Fechar janela">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <form id="product-form">
          <div class="modal-body">
            <div class="form-group">
              <label class="form-label" for="product-name">Nome do Produto</label>
              <input type="text" id="product-name" class="form-input" placeholder="Ex: Vestido Floral Infantil" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="product-category">Categoria</label>
              <select id="product-category" class="form-select" required>
                <option value="" disabled selected>Selecione uma categoria...</option>
                <!-- Populated dynamically via JS -->
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="product-price">Preço (R$)</label>
                <input type="number" id="product-price" class="form-input" step="0.01" min="0.01" placeholder="0,00" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="product-quantity">Quantidade Inicial</label>
                <input type="number" id="product-quantity" class="form-input" step="1" min="0" value="0" required />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancel-modal-btn">Cancelar</button>
            <button type="submit" class="btn-primary" id="save-product-btn">
              <span>Cadastrar Produto</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
    <script src="script.js"></script>
  </body>
</html>
